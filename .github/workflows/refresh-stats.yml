name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}
  # deliberately no `push` trigger -- this job commits, and a push
  # trigger would re-run it forever on its own commit.

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate stats svgs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: commit if changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change, skipping commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
